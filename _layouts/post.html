---
layout: default
---

<article class="page-hero" style="padding-bottom: 0;">
    <div class="container" style="max-width: 800px;">
        <span class="overline">Blog</span>
        <h1 class="page-title">{{ page.title }}</h1>
        <p class="page-subtitle" style="margin-bottom: 8px;">
            {{ page.date | date: "%d/%m/%Y" }}
            {% if page.author %} · {{ page.author }}{% endif %}
        </p>
    </div>
</article>

<section class="about-section">
    <div class="container" style="max-width: 800px;">
        <div class="post-content" style="font-size: 1.05rem; line-height: 1.8;">
            {{ content }}
        </div>

        <div style="margin-top: 60px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1);">
            {% if page.lang == "en" %}
                <a href="/en/blog.html" class="btn btn-secondary">← Back to Blog</a>
                <a href="/en/#contato" class="btn btn-primary">Schedule a strategic conversation</a>
            {% else %}
                <a href="/blog.html" class="btn btn-secondary">← Voltar ao Blog</a>
                <a href="#contato" class="btn btn-primary">Agendar uma conversa estratégica</a>
            {% endif %}
        </div>
    </div>
</section>
