
<!DOCTYPE html>
<html lang="{{ page.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>

    <!-- SEO (title/meta description/Open Graph) e feed do blog, gerados automaticamente -->
    {% seo title=false %}
    {% feed_meta %}

    <!-- Chamando o CSS direto da raiz -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO CONDICIONAL POR IDIOMA (AGORA DENTRO DO BODY) -->
    <header class="header-container">
        {% if page.lang == 'en' %}
            <!-- APENAS MENU EM INGLÊS -->
            <a href="/en/" class="logo-link">
                <img src="/black_new.png" alt="Pedrosa Jr Logo" class="header-logo" style="max-height: 45px; width: auto;"> 
            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="/en/sobre.html">About</a></li>
                    <li><a href="/en/projetos-tracionados.html">Cases</a></li>
                    <li><a href="/en/blog.html">Blog</a></li>
                    <li><a href="/en/contato.html">Contact</a></li>
                    <li><a href="/">PT</a> | <a href="/en/">EN</a></li>
                </ul>
            </nav>
        {% else %}
            <!-- APENAS MENU EM PORTUGUÊS -->
            <a href="/" class="logo-link">
                <img src="/black_new.png" alt="Logo Pedrosa Jr" class="header-logo" style="max-height: 45px; width: auto;"> 
            </a>
            <nav class="main-nav">
                <ul>
                    <li><a href="/sobre.html">Sobre</a></li>
                    <li><a href="/projetos-tracionados.html">Casos</a></li>
                    <li><a href="/blog.html">Blog</a></li>
                    <li><a href="/contato.html">Contato</a></li>
                    <li><a href="/">PT</a> | <a href="/en/">EN</a></li>
                </ul>
            </nav>
        {% endif %}
    </header>

    <!-- INJETA O CONTEÚDO DA PÁGINA -->
    {{ content }}

    <!-- PUXA O RODAPÉ -->
    {% include footer.html %}

    <!-- SCRIPT DE ROLAGEM DO HEADER -->
    <script>
    window.addEventListener('scroll', function() {
        const header = document.querySelector('.header-container');
        if (window.scrollY > 30) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });
    </script>

    <!-- Botão flutuante do WhatsApp (mesmo padrão do site da Drivati); o clique é medido em assets/js/events.js -->
    {% if page.lang == 'en' %}
    <a class="wa-float" href="https://wa.me/5515981027080?text=Hello%2C%20I%20found%20you%20through%20the%20Pedrosa%20Jr%20website." target="_blank" rel="noopener" aria-label="Chat with Pedrosa Jr on WhatsApp">
    {% else %}
    <a class="wa-float" href="https://wa.me/5515981027080?text=Ol%C3%A1%2C%20vim%20pelo%20site%20da%20Pedrosa%20Jr." target="_blank" rel="noopener" aria-label="Falar com a Pedrosa Jr no WhatsApp">
    {% endif %}
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.7-1.2A9 9 0 1 0 12 3z"/><path d="M8.8 8.6c.2-.4.5-.4.8-.4.2 0 .4.2.5.4l.6 1.4c.1.2 0 .4-.1.6l-.5.6c.6 1.2 1.6 2.1 2.8 2.7l.6-.7c.2-.2.4-.2.6-.1l1.4.7c.2.1.3.3.3.5 0 .8-.7 1.5-1.6 1.5-3 0-5.5-2.6-5.5-5.5 0-.5.1-.9.3-1.2z"/></svg>
        <span>WhatsApp</span>
    </a>

    <!-- Aviso de cookies: o Google Analytics (GA4) só é carregado depois do "Aceitar" (ver assets/js/consent.js) -->
    <script src="/assets/js/consent.js" defer></script>

    <!-- Eventos do Analytics: clique no WhatsApp, clique no e-mail e envio do formulário -->
    <script src="/assets/js/events.js" defer></script>

</body>
</html>
