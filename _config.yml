title: "Pedrosa Jr | Digital Traction Engineering"
description: "Engenharia de Tração Digital — estratégia, marca e crescimento sustentável para empresas e projetos de alto valor."
url: "https://pedrosajr.com.br"

# ATENÇÃO: não colocar "permalink:" aqui no nível raiz.
# No Jekyll, o permalink global também se aplica às páginas comuns. Como o
# nosso valor termina em barra, ele apagava o ".html" de contato.html,
# blog.html, o-que-entregamos.html etc., e o menu inteiro do site dava 404.
# Por isso o permalink dos posts agora fica em "defaults", com escopo de posts.

# Plugins liberados pelo GitHub Pages (não precisa de Gemfile/bundle install):
# - jekyll-sitemap  -> gera /sitemap.xml automaticamente
# - jekyll-seo-tag  -> gera <title>/meta description/Open Graph em cada página
# - jekyll-feed     -> gera /feed.xml (RSS) do blog
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:year/:month/:day/:title/

# Arquivos/pastas que não devem ser publicados no site
# (inclui arquivos de backup/rascunho com extensão quebrada que já existiam no repo)
exclude:
  - README.md
  - BLOG-README.md
  - "*.ht"
  - "*.htm"
  - "*.tml"
  - "assets/css/Backup.CS"
  # Páginas soltas que não fazem parte do site (index_alt.html é uma cópia antiga da home
  # e images/preview.html é um rascunho). Fora do site e do sitemap, para o Google não
  # indexar duplicatas da página inicial. Os arquivos continuam no repositório.
  - index_alt.html
  - images/preview.html
