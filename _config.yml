title: "Pedrosa Jr | Digital Traction Engineering"
description: "Engenharia de Tração Digital — estratégia, marca e crescimento sustentável para empresas e projetos de alto valor."
url: "https://pedrosajr.com.br"

# Deixa os posts do blog com uma URL limpa e datada.
# Posts em inglês sobrescrevem isso individualmente no front matter (veja BLOG-README.md).
permalink: /blog/:year/:month/:day/:title/

# Plugins liberados pelo GitHub Pages (não precisa de Gemfile/bundle install):
# - jekyll-sitemap  -> gera /sitemap.xml automaticamente (ajuda o Google a indexar o site e o blog)
# - jekyll-seo-tag  -> gera <title>/meta description/Open Graph corretos em cada página, a partir do front matter
# - jekyll-feed     -> gera /feed.xml (RSS) do blog
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# Arquivos/pastas que não devem ser publicados no site
# (inclui arquivos de backup/rascunho com extensão quebrada que já existiam no repo)
exclude:
  - README.md
  - BLOG-README.md
  - "*.ht"
  - "*.htm"
  - "*.tml"
  - "assets/css/Backup.CS"
